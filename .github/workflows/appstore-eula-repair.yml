name: App Store EULA metadata repair

on:
  workflow_dispatch:
    inputs:
      app_store_version:
        description: "App Store version to repair"
        required: true
        default: "1.0"

jobs:
  add-eula-link:
    name: Add EULA link to App Description
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Bodywise Remedy
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Add Apple Standard EULA link
        env:
          APP_STORE_CONNECT_APP_ID: "6795566131"
          APP_STORE_VERSION: ${{ inputs.app_store_version }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.APPSTORE_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
        run: node scripts/appstore-eula-repair.mjs
