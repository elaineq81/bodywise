name: App Store prepare version for review

on:
  workflow_dispatch:
    inputs:
      app_store_version:
        description: "App Store version to prepare"
        required: true
        default: "1.1"

jobs:
  prepare-review:
    name: Attach build and prepare metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Bodywise Remedy
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare App Store version
        env:
          APP_STORE_CONNECT_APP_ID: "6795566131"
          APP_STORE_VERSION: ${{ inputs.app_store_version }}
          APP_STORE_PLATFORM: "IOS"
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: node scripts/appstore-prepare-version-for-review.mjs