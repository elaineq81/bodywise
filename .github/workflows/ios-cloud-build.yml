name: Bodywise iOS cloud build

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload to TestFlight after building. Requires Apple signing secrets."
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "public/**"
      - "ios/**"
      - "scripts/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-cloud-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "public/**"
      - "ios/**"
      - "scripts/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-cloud-build.yml"

concurrency:
  group: bodywise-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Build iOS app on macOS
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out Bodywise
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app and sync iOS project
        run: npm run ios:sync

      - name: Show Xcode schemes
        run: xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build unsigned simulator app
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  testflight-upload:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    needs: simulator-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight == true }}

    steps:
      - name: Check out Bodywise
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app and sync iOS project
        run: npm run ios:sync

      - name: Prepare Apple API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          test -n "$APPSTORE_PRIVATE_KEY"
          test -n "$APPSTORE_KEY_ID"
          mkdir -p "$RUNNER_TEMP/appstore"
          printf "%s" "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/appstore/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Archive signed iOS app
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPSTORE_KEY_ID"
          test -n "$APPSTORE_ISSUER_ID"
          test -n "$APPLE_TEAM_ID"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Bodywise.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/appstore/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Bodywise.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/appstore/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Upload to App Store Connect / TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Keep IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodywise-ios-export
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
