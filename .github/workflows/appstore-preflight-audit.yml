name: App Store preflight audit

on:
  workflow_dispatch:
    inputs:
      app_store_version:
        description: "App Store version to audit"
        required: true
        default: "1.0"

jobs:
  preflight-audit:
    name: Read-only App Store submission audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Bodywise Remedy
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit App Store submission readiness
        env:
          APP_STORE_CONNECT_APP_ID: "6795566131"
          APP_STORE_VERSION: ${{ inputs.app_store_version }}
          APP_STORE_PLATFORM: "IOS"
          APP_STORE_SUBSCRIPTION_GROUP_ID: "22277285"
          APP_STORE_SUBSCRIPTION_IDS: "6796619284,6796621786"
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: node scripts/appstore-preflight-audit.mjs
